# 深度受限字母序前缀码服务 —— Docker Compose
#
# 默认只启动 API：
#   docker compose up --build
#   API_PORT=9099 docker compose up --build     # 用宿主 9099 端口覆盖默认 8000
#
# 一次性验收（全量 pytest + 穷举复核，结束即退出并清理）：
#   docker compose run --rm verify

services:
  api:
    build: .
    image: alphabetic-prefix-code:latest
    ports:
      # 宿主端口由环境变量 API_PORT 覆盖，默认 8000；容器内恒为 8000。
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 一次性验收服务：运行测试套件（含 Catalan 全树穷举复核），退出码即验收结论。
  verify:
    image: alphabetic-prefix-code:latest
    build: .
    command: ["pytest", "-v"]
    profiles: ["verify"]
